<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="logo-accent" x1="40" y1="30" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="120" height="120" rx="26" fill="url(#logo-bg)"/>
  <!-- Stylised "L" letterform -->
  <path d="M38 30 L38 78 C38 83.5 42.5 88 48 88 L82 88" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Accent dot / signal indicator -->
  <circle cx="82" cy="38" r="10" fill="url(#logo-accent)"/>
  <circle cx="82" cy="38" r="5" fill="white" opacity="0.9"/>
</svg>
