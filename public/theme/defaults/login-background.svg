<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leftbg" x1="0" y1="0" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C1445"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0C1445" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Left panel — dark navy -->
  <rect x="0" y="0" width="960" height="1080" fill="url(#leftbg)"/>
  <rect x="0" y="0" width="960" height="1080" fill="url(#glow)"/>

  <!-- Right panel — white -->
  <rect x="960" y="0" width="960" height="1080" fill="#F8FAFF"/>

  <!-- Subtle divider line -->
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#2563EB" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Logo mark — centered in left panel -->
  <svg x="390" y="390" width="180" height="180" viewBox="0 0 120 120">
    <defs>
      <linearGradient id="iconbg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F0F4FF"/>
        <stop offset="100%" stop-color="#E4ECFF"/>
      </linearGradient>
    </defs>
    <rect width="120" height="120" rx="24" fill="url(#iconbg)"/>
    <g fill="#1E3A8A">
      <rect x="22" y="64" width="74" height="8" rx="2" fill="#2451B0"/>
      <path d="M 22 64 L 8 60 C 6 59.5 6 63.5 8 64.5 L 22 72 Z"/>
      <path d="M 32 72 L 86 72 L 82 85 L 36 85 Z"/>
      <rect x="26" y="85" width="66" height="7" rx="3"/>
    </g>
    <g fill="#2563EB">
      <ellipse cx="60" cy="52" rx="11" ry="7" transform="rotate(-8 60 52)"/>
      <circle cx="73" cy="42" r="7.5"/>
      <ellipse cx="67" cy="47" rx="7" ry="5" transform="rotate(-20 67 47)"/>
      <path d="M 79 39 L 93 35 L 79 47 Z"/>
      <path d="M 51 55 C 47 47 40 33 36 22 C 38 18 42 20 44 24 C 48 35 52 51 54 56 Z"/>
      <path d="M 49 57 C 43 51 34 38 30 28 C 28 24 30 22 33 24 C 38 34 45 51 48 58 Z" opacity="0.35"/>
      <line x1="58" y1="58" x2="56" y2="64" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
      <line x1="65" y1="58" x2="67" y2="64" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    </g>
    <circle cx="75" cy="41" r="2.5" fill="white"/>
    <circle cx="75" cy="41" r="1.2" fill="#1E3A8A"/>
  </svg>

  <!-- "WrenForge" wordmark -->
  <text x="480" y="608"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="40" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-0.5">WrenForge</text>

  <!-- Tagline -->
  <text x="480" y="648"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14" font-weight="500" fill="white" fill-opacity="0.45"
    text-anchor="middle" letter-spacing="2">FORGE EVERY DEAL.</text>

  <!-- Subtle corner rings on left panel -->
  <circle cx="80" cy="80" r="200" stroke="white" stroke-opacity="0.03" stroke-width="1" fill="none"/>
  <circle cx="80" cy="80" r="340" stroke="white" stroke-opacity="0.02" stroke-width="1" fill="none"/>
  <circle cx="880" cy="1000" r="240" stroke="white" stroke-opacity="0.025" stroke-width="1" fill="none"/>
</svg>
