<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep blue-slate base gradient -->
    <linearGradient id="lbg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Top-left blue glow -->
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom-right green glow -->
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.45">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <!-- Center subtle glow -->
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#lbg)"/>

  <!-- Colour orbs -->
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <rect width="1920" height="1080" fill="url(#glow3)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#dots)"/>
  </g>

  <!-- Decorative geometric rings (top-left) -->
  <circle cx="200" cy="180" r="160" stroke="#2563EB" stroke-opacity="0.08" stroke-width="1" fill="none"/>
  <circle cx="200" cy="180" r="220" stroke="#2563EB" stroke-opacity="0.05" stroke-width="1" fill="none"/>
  <circle cx="200" cy="180" r="280" stroke="#2563EB" stroke-opacity="0.03" stroke-width="1" fill="none"/>

  <!-- Decorative geometric rings (bottom-right) -->
  <circle cx="1720" cy="900" r="140" stroke="#22C55E" stroke-opacity="0.08" stroke-width="1" fill="none"/>
  <circle cx="1720" cy="900" r="200" stroke="#22C55E" stroke-opacity="0.05" stroke-width="1" fill="none"/>
  <circle cx="1720" cy="900" r="260" stroke="#22C55E" stroke-opacity="0.03" stroke-width="1" fill="none"/>

  <!-- Thin diagonal accent line -->
  <line x1="0" y1="1080" x2="1920" y2="0" stroke="url(#glow1)" stroke-opacity="0.04" stroke-width="1"/>
</svg>
