  <rect width="120" height="120" rx="26" fill="url(#bg13)"/>

  <!-- Shield -->
  <path d="M 60 13 L 100 28 L 100 61 C 100 83, 83 99, 60 109 C 37 99, 20 83, 20 61 L 20 28 Z"
