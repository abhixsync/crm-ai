<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg40" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="gem40a" x1="20" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BFDBFE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gem40b" x1="100" y1="10" x2="40" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="gem40c" x1="60" y1="10" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg40)"/>

  <!-- Crystal/gem faceted wren — diamond-cut silhouette -->
  <!-- Upper crown facets (head area) -->
  <polygon points="60,8 44,24 60,28 76,24" fill="url(#gem40a)" opacity="0.95"/>
  <polygon points="60,8 44,24 34,16" fill="url(#gem40b)" opacity="0.8"/>
  <polygon points="60,8 76,24 86,16" fill="url(#gem40c)" opacity="0.9"/>

  <!-- Beak facet -->
  <polygon points="76,24 86,16 96,10 88,24" fill="#93C5FD" opacity="0.7"/>
  <polygon points="88,24 96,10 104,18" fill="#DBEAFE" opacity="0.6"/>

  <!-- Mid-body facets (main prism) -->
  <polygon points="44,24 60,28 46,44" fill="url(#gem40c)" opacity="0.85"/>
  <polygon points="76,24 60,28 74,44" fill="url(#gem40a)" opacity="0.9"/>
  <polygon points="60,28 46,44 60,52 74,44" fill="url(#gem40b)" opacity="0.95"/>
  <polygon points="44,24 34,16 28,34 46,44" fill="#1D4ED8" opacity="0.7"/>
  <polygon points="76,24 86,16 92,34 74,44" fill="#3B82F6" opacity="0.75"/>

  <!-- Lower body / pavilion facets -->
  <polygon points="46,44 60,52 46,66" fill="url(#gem40a)" opacity="0.8"/>
  <polygon points="74,44 60,52 74,66" fill="url(#gem40b)" opacity="0.85"/>
  <polygon points="60,52 46,66 60,80 74,66" fill="url(#gem40c)" opacity="0.9"/>
  <polygon points="28,34 46,44 46,66 30,58" fill="#1E40AF" opacity="0.65"/>
  <polygon points="92,34 74,44 74,66 90,58" fill="#2563EB" opacity="0.70"/>

  <!-- Tail facets (pointed, upward-cocked) -->
  <polygon points="46,44 28,34 20,50 30,58" fill="#1D4ED8" opacity="0.6"/>
  <polygon points="28,34 20,50 14,36 20,22" fill="#1E3A8A" opacity="0.5"/>
  <polygon points="20,22 34,16 28,34" fill="#3B82F6" opacity="0.6"/>

  <!-- Culet / bottom point -->
  <polygon points="46,66 60,80 74,66 60,96" fill="url(#gem40c)" opacity="0.8"/>
  <polygon points="30,58 46,66 60,80 40,88" fill="#1D4ED8" opacity="0.6"/>
  <polygon points="90,58 74,66 60,80 80,88" fill="#2563EB" opacity="0.65"/>

  <!-- Highlight facet (light catch) -->
  <polygon points="60,8 76,24 70,18" fill="white" opacity="0.6"/>
  <polygon points="60,28 50,36 56,42" fill="white" opacity="0.3"/>

  <!-- Eye (gem inclusion — a darker prism) -->
  <polygon points="74,24 80,20 84,26 78,30" fill="#030712" opacity="0.8"/>
  <circle cx="79" cy="25" r="1.5" fill="#60A5FA" opacity="0.9"/>
</svg>
