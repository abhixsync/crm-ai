  <!-- Wing feather details -->
  <g stroke="white" stroke-width="0.8" opacity="0.3" fill="none">
    <path d="M 44 56 C 38 58, 30 60, 22 64"/>
    <path d="M 38 60 C 30 62, 22 66, 16 70"/>
    <path d="M 76 56 C 82 58, 90 60, 98 64"/>
    <path d="M 82 60 C 90 62, 98 66, 104 70"/>
