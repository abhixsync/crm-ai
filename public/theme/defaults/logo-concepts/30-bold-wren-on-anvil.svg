<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg30" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg30)"/>

  <!-- BOLD / HIGH CONTRAST silhouette version -->
  <!-- Anvil — thick, bold, chunky -->
  <g fill="#3B82F6">
    <path d="M 16 80 L 104 80 L 112 72 L 8 72 Z"/>
    <path d="M 8 72 L 0 66 C -2 64, -2 68, 0 70 L 8 80 Z" opacity="0.7"/>
    <rect x="26" y="80" width="68" height="12" rx="2"/>
    <path d="M 20 92 L 100 92 L 96 106 L 24 106 Z"/>
    <rect x="18" y="106" width="84" height="7" rx="3.5"/>
  </g>

  <!-- Wren — thick bold silhouette, high contrast white -->
  <g fill="white">
    <!-- Body (chunky) -->
    <ellipse cx="62" cy="54" rx="16" ry="10" transform="rotate(-12, 62, 54)"/>
    <!-- Head (large) -->
    <circle cx="78" cy="38" r="12"/>
    <!-- Neck fill -->
    <ellipse cx="71" cy="45" rx="10" ry="8" transform="rotate(-28, 71, 45)"/>
    <!-- Bold beak -->
    <path d="M 87 34 L 103 27 L 87 46 Z"/>
    <!-- Bold cocked tail -->
    <path d="M 42 60 C 32 48, 20 32, 14 22 C 11 17, 14 14, 17 17 C 24 28, 38 46, 44 60 Z"/>
    <!-- Wing fold -->
    <path d="M 52 58 C 42 46, 30 32, 22 22 C 20 19, 21 17, 23 19 C 32 30, 46 48, 54 60 Z" opacity="0.7"/>
  </g>
  <!-- Eye (large, distinct) -->
  <circle cx="82" cy="36" r="3.5" fill="#172554"/>
  <circle cx="83" cy="35" r="1.4" fill="white"/>
</svg>
