<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <radialGradient id="hi2" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg2)"/>
  <rect width="120" height="120" rx="26" fill="url(#hi2)"/>

  <!-- Anvil -->
  <g fill="white" opacity="0.9">
    <!-- Anvil top face -->
    <path d="M 30 72 L 90 72 L 96 66 L 24 66 Z"/>
    <!-- Anvil horn (left) -->
    <path d="M 24 66 L 14 62 C 12 61, 12 63, 14 64 L 24 72 Z"/>
    <!-- Anvil body -->
    <rect x="36" y="72" width="48" height="10" rx="1"/>
    <!-- Anvil base -->
    <path d="M 28 82 L 92 82 L 88 94 L 32 94 Z"/>
    <!-- Base foot -->
    <rect x="26" y="94" width="68" height="4" rx="2"/>
  </g>

  <!-- Wren perched on anvil -->
  <g fill="white">
    <!-- Body -->
    <ellipse cx="62" cy="52" rx="10" ry="7" transform="rotate(-10, 62, 52)"/>
    <!-- Head -->
    <circle cx="74" cy="42" r="7"/>
    <!-- Neck -->
    <ellipse cx="68" cy="46" rx="6" ry="5" transform="rotate(-20, 68, 46)"/>
    <!-- Beak -->
    <path d="M 80 39 L 90 35 L 80 43 Z"/>
    <!-- Left wing folded -->
    <path d="M 54 48 C 46 40, 36 32, 30 28 C 28 28, 28 30, 30 32 C 36 40, 46 50, 52 54 Z"/>
    <!-- Tail cocked UP sharply -->
    <path d="M 48 54 C 42 48, 34 36, 30 28 C 28 24, 30 22, 32 24 C 38 34, 46 48, 50 54 Z"/>
    <path d="M 46 56 C 40 52, 30 42, 26 34 C 24 30, 26 28, 28 30 C 34 40, 44 52, 48 56 Z"/>
    <!-- Legs on anvil -->
    <line x1="58" y1="58" x2="56" y2="66" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="64" y1="58" x2="66" y2="66" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <circle cx="76" cy="41" r="1.5" fill="#1B4BC8"/>

  <!-- Forge sparks from anvil -->
  <g fill="#F59E0B">
    <circle cx="50" cy="64" r="1.2" opacity="0.6"/>
    <circle cx="76" cy="62" r="1" opacity="0.5"/>
    <circle cx="44" cy="60" r="0.8" opacity="0.4"/>
    <circle cx="82" cy="58" r="0.7" opacity="0.35"/>
  </g>
  <g fill="white">
    <circle cx="46" cy="58" r="0.6" opacity="0.5"/>
    <circle cx="80" cy="56" r="0.6" opacity="0.5"/>
  </g>
</svg>
