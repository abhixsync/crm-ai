<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg43" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050D1A"/>
      <stop offset="100%" stop-color="#0F1E3C"/>
    </linearGradient>
    <radialGradient id="nodeglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg43)"/>

  <!-- Wren head silhouette (large, dominant) -->
  <circle cx="66" cy="52" r="36" fill="#0A1628"/>
  <circle cx="66" cy="52" r="36" fill="none" stroke="#1E40AF" stroke-width="1.5" opacity="0.8"/>

  <!-- Beak -->
  <path d="M 96 50 L 110 44 L 96 58 Z" fill="#3B82F6" opacity="0.9"/>

  <!-- Neural network INSIDE the head -->
  <!-- Input layer nodes (left) -->
  <g fill="#2563EB">
    <circle cx="38" cy="36" r="3.5"/>
    <circle cx="38" cy="52" r="3.5"/>
    <circle cx="38" cy="68" r="3.5"/>
  </g>
  <!-- Hidden layer 1 -->
  <g fill="#3B82F6">
    <circle cx="56" cy="30" r="3"/>
    <circle cx="56" cy="44" r="3"/>
    <circle cx="56" cy="58" r="3"/>
    <circle cx="56" cy="72" r="3"/>
  </g>
  <!-- Hidden layer 2 -->
  <g fill="#60A5FA">
    <circle cx="74" cy="36" r="3"/>
    <circle cx="74" cy="52" r="3"/>
    <circle cx="74" cy="68" r="3"/>
  </g>
  <!-- Output node -->
  <circle cx="90" cy="52" r="4" fill="#93C5FD"/>
  <circle cx="90" cy="52" r="7" fill="url(#nodeglow)" opacity="0.6"/>

  <!-- Neural connections -->
  <g stroke="#1E3A8A" stroke-width="0.7" opacity="0.6">
    <!-- Input to hidden1 -->
    <line x1="38" y1="36" x2="56" y2="30"/>
    <line x1="38" y1="36" x2="56" y2="44"/>
    <line x1="38" y1="36" x2="56" y2="58"/>
    <line x1="38" y1="52" x2="56" y2="30"/>
    <line x1="38" y1="52" x2="56" y2="44"/>
    <line x1="38" y1="52" x2="56" y2="58"/>
    <line x1="38" y1="52" x2="56" y2="72"/>
    <line x1="38" y1="68" x2="56" y2="44"/>
    <line x1="38" y1="68" x2="56" y2="58"/>
    <line x1="38" y1="68" x2="56" y2="72"/>
    <!-- Hidden1 to hidden2 -->
    <line x1="56" y1="30" x2="74" y2="36"/>
    <line x1="56" y1="30" x2="74" y2="52"/>
    <line x1="56" y1="44" x2="74" y2="36"/>
    <line x1="56" y1="44" x2="74" y2="52"/>
    <line x1="56" y1="44" x2="74" y2="68"/>
    <line x1="56" y1="58" x2="74" y2="36"/>
    <line x1="56" y1="58" x2="74" y2="52"/>
    <line x1="56" y1="58" x2="74" y2="68"/>
    <line x1="56" y1="72" x2="74" y2="52"/>
    <line x1="56" y1="72" x2="74" y2="68"/>
    <!-- Hidden2 to output -->
    <line x1="74" y1="36" x2="90" y2="52"/>
    <line x1="74" y1="52" x2="90" y2="52"/>
    <line x1="74" y1="68" x2="90" y2="52"/>
  </g>

  <!-- Active signal pulse (highlighted path) -->
  <g stroke="#60A5FA" stroke-width="1.5" opacity="0.85">
    <line x1="38" y1="52" x2="56" y2="44"/>
    <line x1="56" y1="44" x2="74" y2="52"/>
    <line x1="74" y1="52" x2="90" y2="52"/>
  </g>

  <!-- Wren eye -->
  <circle cx="80" cy="40" r="5" fill="#0A1628" stroke="#60A5FA" stroke-width="1.5"/>
  <circle cx="80" cy="40" r="2.5" fill="#60A5FA"/>
  <circle cx="81" cy="39" r="1" fill="white"/>

  <!-- Head crest detail (tuft) -->
  <path d="M 66 16 C 62 10, 60 6, 64 4 C 68 2, 72 6, 70 14 C 68 10, 66 14, 66 16 Z"
        fill="#1E40AF" opacity="0.8"/>
</svg>
