<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg47" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C1A2E"/>
      <stop offset="100%" stop-color="#1B3068"/>
    </linearGradient>
    <!-- Left half: organic/natural (warm) -->
    <linearGradient id="organic47" x1="0" y1="0" x2="60" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- Right half: digital/tech (electric blue) -->
    <linearGradient id="digital47" x1="60" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <clipPath id="left47">
      <rect x="0" y="0" width="60" height="120"/>
    </clipPath>
    <clipPath id="right47">
      <rect x="60" y="0" width="60" height="120"/>
    </clipPath>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg47)"/>

  <!-- Left half: organic wren (fluid, natural) -->
  <g clip-path="url(#left47)">
    <g fill="url(#organic47)" opacity="0.92">
      <!-- Organic body (smooth, fluid) -->
      <path d="M 56 60 C 50 50, 42 42, 38 36 C 34 30, 34 24, 38 22 C 42 20, 48 24, 52 32 C 56 40, 58 52, 58 62 Z"/>
      <!-- Organic wing -->
      <path d="M 50 54 C 40 46, 28 36, 20 30 C 16 27, 15 29, 17 32 C 24 40, 38 50, 50 58 Z"/>
      <!-- Organic tail (curved, feathery) -->
      <path d="M 44 62 C 36 56, 26 46, 20 36 C 16 28, 18 22, 22 24 C 26 30, 32 44, 40 58 Z"/>
    </g>
  </g>

  <!-- Right half: digital wren (geometric, circuit) -->
  <g clip-path="url(#right47)">
    <g fill="url(#digital47)" opacity="0.92">
      <!-- Digital body (straight lines, angular) -->
      <polygon points="60,60 68,42 80,42 88,58 80,74 68,74"/>
      <!-- Digital wing (stepped) -->
      <path d="M 68 52 L 80 46 L 96 44 L 100 48 L 88 52 L 80 58 Z"/>
      <!-- Digital tail (sharp angles) -->
      <polygon points="62,62 72,56 80,64 72,72"/>
    </g>
    <!-- Circuit traces on digital side -->
    <g stroke="#1E3A8A" stroke-width="0.8" fill="none" opacity="0.5">
      <path d="M 80 48 L 80 38 L 90 38"/>
      <path d="M 88 58 L 100 58 L 100 68"/>
      <path d="M 76 68 L 76 80 L 86 80"/>
    </g>
    <g fill="#1E3A8A">
      <circle cx="90" cy="38" r="2" fill="#60A5FA" opacity="0.8"/>
      <circle cx="100" cy="68" r="2" fill="#60A5FA" opacity="0.8"/>
      <circle cx="86" cy="80" r="2" fill="#60A5FA" opacity="0.8"/>
    </g>
  </g>

  <!-- Center dividing line (the split) -->
  <line x1="60" y1="10" x2="60" y2="110" stroke="white" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 3"/>

  <!-- Head (shared, at center, shows both halves) -->
  <circle cx="60" cy="36" r="14" fill="none" stroke="white" stroke-width="0"/>
  <!-- Left head half organic -->
  <g clip-path="url(#left47)">
    <circle cx="60" cy="36" r="14" fill="url(#organic47)" opacity="0.9"/>
  </g>
  <!-- Right head half digital -->
  <g clip-path="url(#right47)">
    <circle cx="60" cy="36" r="14" fill="url(#digital47)" opacity="0.9"/>
  </g>

  <!-- Beak -->
  <path d="M 68 30 L 80 26 L 68 40 Z" fill="white" opacity="0.8"/>
  <!-- Eye (center split) -->
  <circle cx="62" cy="34" r="3" fill="white" opacity="0.9"/>
  <circle cx="62" cy="34" r="1.5" fill="#0C1A2E"/>
</svg>
