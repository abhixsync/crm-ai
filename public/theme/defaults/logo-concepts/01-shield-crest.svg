<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <radialGradient id="hi1" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg1)"/>
  <rect width="120" height="120" rx="26" fill="url(#hi1)"/>

  <!-- Shield shape -->
  <path d="M 60 14 L 100 30 L 100 62 C 100 82, 84 98, 60 108 C 36 98, 20 82, 20 62 L 20 30 Z"
        fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner shield highlight -->
  <path d="M 60 22 L 92 35 L 92 60 C 92 76, 79 90, 60 98 C 41 90, 28 76, 28 60 L 28 35 Z"
        fill="white" opacity="0.06"/>

  <!-- Wren bird inside shield -->
  <g fill="white">
    <!-- Left wing -->
    <path d="M 52 56 C 44 46, 34 36, 28 32 C 26 32, 26 34, 28 36 C 34 44, 44 54, 50 60 Z"/>
    <!-- Right wing -->
    <path d="M 68 52 C 74 44, 84 34, 90 30 C 92 30, 92 32, 90 34 C 84 42, 74 52, 68 58 Z"/>
    <!-- Body -->
    <ellipse cx="60" cy="60" rx="11" ry="8" transform="rotate(-18, 60, 60)"/>
    <!-- Neck + Head -->
    <ellipse cx="67" cy="52" rx="7" ry="5" transform="rotate(-28, 67, 52)"/>
    <circle cx="74" cy="46" r="7"/>
    <!-- Beak -->
    <path d="M 80 43 L 88 40 L 80 47 Z"/>
    <!-- Tail cocked up -->
    <path d="M 46 62 C 40 56, 34 46, 32 40 C 30 36, 32 34, 34 36 C 38 44, 44 56, 48 60 Z"/>
  </g>
  <circle cx="76" cy="45" r="1.5" fill="#1B4BC8"/>
</svg>
