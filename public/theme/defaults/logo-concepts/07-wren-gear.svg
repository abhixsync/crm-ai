<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg7" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <radialGradient id="hi7" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg7)"/>
  <rect width="120" height="120" rx="26" fill="url(#hi7)"/>

  <!-- Gear cog — 8 teeth around a circle -->
  <g fill="none" stroke="white" stroke-width="2">
    <!-- Outer gear ring -->
    <circle cx="60" cy="62" r="36"/>
    <!-- Inner ring -->
    <circle cx="60" cy="62" r="28" stroke-width="1" opacity="0.4"/>
    <!-- Gear teeth -->
    <g stroke-width="2.5" stroke-linecap="round">
      <line x1="60" y1="20" x2="60" y2="14"/>
      <line x1="85" y1="27" x2="89" y2="22"/>
      <line x1="98" y1="50" x2="104" y2="48"/>
      <line x1="98" y1="74" x2="104" y2="76"/>
      <line x1="85" y1="97" x2="89" y2="102"/>
      <line x1="60" y1="104" x2="60" y2="110"/>
      <line x1="35" y1="97" x2="31" y2="102"/>
      <line x1="22" y1="74" x2="16" y2="76"/>
      <line x1="22" y1="50" x2="16" y2="48"/>
      <line x1="35" y1="27" x2="31" y2="22"/>
    </g>
  </g>

  <!-- Wren inside the gear -->
  <g fill="white">
    <!-- Left wing -->
    <path d="M 48 56 C 42 48, 36 40, 32 36 C 30 36, 30 38, 32 40 C 36 46, 42 54, 46 58 Z"/>
    <!-- Right wing -->
    <path d="M 68 54 C 72 48, 80 40, 84 36 C 86 36, 86 38, 84 40 C 80 46, 72 54, 68 58 Z"/>
    <!-- Body -->
    <ellipse cx="58" cy="60" rx="10" ry="7" transform="rotate(-14, 58, 60)"/>
    <!-- Neck + Head -->
    <ellipse cx="65" cy="54" rx="6" ry="4" transform="rotate(-24, 65, 54)"/>
    <circle cx="72" cy="48" r="6"/>
    <!-- Beak -->
    <path d="M 77 46 L 84 43 L 77 50 Z"/>
    <!-- Tail cocked up -->
    <path d="M 44 62 C 40 56, 34 48, 32 42 C 30 38, 32 36, 34 38 C 38 46, 42 56, 46 60 Z"/>
    <path d="M 42 64 C 38 60, 32 52, 28 46 C 26 42, 28 40, 30 42 C 34 50, 40 58, 44 64 Z"/>
  </g>
  <circle cx="73" cy="47" r="1.3" fill="#1B4BC8"/>
</svg>
