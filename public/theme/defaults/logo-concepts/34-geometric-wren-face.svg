<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg34" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg34)"/>

  <!-- Low-poly front-facing wren head portrait -->
  <!-- Made of triangular facets (different white opacities) -->

  <!-- Skull/crown facets -->
  <polygon points="60,10 40,28 60,30" fill="white" opacity="0.95"/>
  <polygon points="60,10 80,28 60,30" fill="white" opacity="0.80"/>
  <polygon points="40,28 30,42 46,38" fill="white" opacity="0.70"/>
  <polygon points="80,28 90,42 74,38" fill="white" opacity="0.85"/>
  <polygon points="40,28 46,38 60,30" fill="white" opacity="0.60"/>
  <polygon points="80,28 74,38 60,30" fill="white" opacity="0.75"/>

  <!-- Face facets (cheeks, forehead) -->
  <polygon points="46,38 30,52 36,56" fill="white" opacity="0.55"/>
  <polygon points="74,38 90,52 84,56" fill="white" opacity="0.65"/>
  <polygon points="46,38 36,56 50,52" fill="white" opacity="0.45"/>
  <polygon points="74,38 84,56 70,52" fill="white" opacity="0.55"/>
  <polygon points="46,38 60,30 60,46" fill="white" opacity="0.50"/>
  <polygon points="74,38 60,30 60,46" fill="white" opacity="0.60"/>

  <!-- Eye sockets (dark facets) -->
  <!-- Left eye area -->
  <polygon points="42,44 36,56 50,52" fill="#1B4BC8" opacity="0.7"/>
  <!-- Right eye area -->
  <polygon points="78,44 84,56 70,52" fill="#1B4BC8" opacity="0.7"/>
  <!-- Eye lights -->
  <circle cx="44" cy="50" r="4" fill="white" opacity="0.9"/>
  <circle cx="76" cy="50" r="4" fill="white" opacity="0.9"/>
  <circle cx="44" cy="50" r="2" fill="#1B4BC8"/>
  <circle cx="76" cy="50" r="2" fill="#1B4BC8"/>
  <circle cx="45" cy="49" r="0.9" fill="white" opacity="0.8"/>
  <circle cx="77" cy="49" r="0.9" fill="white" opacity="0.8"/>

  <!-- Beak (center, triangular) -->
  <polygon points="60,56 52,68 68,68" fill="#F59E0B" opacity="0.9"/>
  <polygon points="60,56 52,68 60,62" fill="#FCD34D" opacity="0.5"/>

  <!-- Lower face/chin facets -->
  <polygon points="36,56 52,68 44,74" fill="white" opacity="0.40"/>
  <polygon points="84,56 68,68 76,74" fill="white" opacity="0.50"/>
  <polygon points="44,74 52,68 60,80" fill="white" opacity="0.35"/>
  <polygon points="76,74 68,68 60,80" fill="white" opacity="0.45"/>
  <polygon points="44,74 60,80 40,84" fill="white" opacity="0.30"/>
  <polygon points="76,74 60,80 80,84" fill="white" opacity="0.40"/>

  <!-- Crest on top (single raised polygon) -->
  <polygon points="60,10 52,20 68,20" fill="white" opacity="0.9"/>
  <polygon points="55,16 60,6 65,16" fill="white" opacity="0.7"/>
</svg>
