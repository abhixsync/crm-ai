<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg28" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg28)"/>

  <!-- Anvil -->
  <g fill="white" opacity="0.88">
    <path d="M 20 76 L 100 76 L 106 70 L 14 70 Z"/>
    <path d="M 14 70 L 6 66 C 4 65, 4 68, 6 69 L 14 76 Z"/>
    <rect x="28" y="76" width="64" height="9" rx="1"/>
    <path d="M 24 85 L 96 85 L 92 96 L 28 96 Z"/>
    <rect x="22" y="96" width="76" height="5" rx="2.5"/>
  </g>

  <!-- Wren landing — wings half open, motion blur -->
  <g fill="white">
    <!-- Left wing (swept back, still partly spread) -->
    <path d="M 54 58 C 46 48, 34 38, 20 30 C 18 29, 17 31, 19 33 C 30 43, 42 54, 52 62 Z"/>
    <!-- Right wing (partly folding) -->
    <path d="M 66 54 C 72 46, 80 38, 90 32 C 92 31, 93 33, 91 35 C 82 44, 74 54, 68 62 Z"/>
    <!-- Body -->
    <ellipse cx="60" cy="62" rx="10" ry="6.5" transform="rotate(-8, 60, 62)"/>
    <!-- Head -->
    <circle cx="72" cy="53" r="7.5"/>
    <!-- Neck -->
    <ellipse cx="67" cy="57" rx="6" ry="5" transform="rotate(-18, 67, 57)"/>
    <!-- Beak -->
    <path d="M 77 50 L 87 46 L 77 57 Z"/>
    <!-- Tail angled down (landing posture) -->
    <path d="M 48 64 C 42 60, 36 54, 32 48 C 30 46, 31 44, 33 45 C 37 50, 44 58, 48 64 Z"/>
    <!-- Legs extended for landing -->
    <line x1="56" y1="68" x2="52" y2="76" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="64" y1="68" x2="66" y2="76" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Toe spreads -->
    <line x1="52" y1="76" x2="48" y2="78" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="52" y1="76" x2="54" y2="78" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="66" y1="76" x2="70" y2="78" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="66" y1="76" x2="64" y2="78" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <circle cx="74" cy="52" r="1.8" fill="#1B4BC8"/>

  <!-- Impact sparks from landing -->
  <g fill="#F59E0B">
    <circle cx="44" cy="70" r="2" opacity="0.9"/>
    <circle cx="76" cy="68" r="1.6" opacity="0.8"/>
    <circle cx="36" cy="66" r="1.2" opacity="0.7"/>
    <circle cx="86" cy="64" r="1" opacity="0.6"/>
    <path d="M 48 70 L 44 62 L 50 70 Z" opacity="0.8"/>
    <path d="M 72 68 L 76 60 L 74 68 Z" opacity="0.8"/>
  </g>
  <g fill="white" opacity="0.6">
    <circle cx="40" cy="64" r="1"/>
    <circle cx="80" cy="62" r="0.8"/>
    <circle cx="60" cy="66" r="1.2"/>
  </g>
</svg>
