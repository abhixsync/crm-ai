<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <radialGradient id="hi6" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg6)"/>
  <rect width="120" height="120" rx="26" fill="url(#hi6)"/>

  <!-- W letterform — bold, geometric -->
  <path d="M 14 28 L 30 88 L 46 48 L 62 88 L 78 28"
        stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- F letterform — overlapping, offset right -->
  <g stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <!-- F vertical -->
    <line x1="72" y1="28" x2="72" y2="94"/>
    <!-- F top bar -->
    <line x1="72" y1="28" x2="106" y2="28"/>
    <!-- F middle bar -->
    <line x1="72" y1="58" x2="100" y2="58"/>
  </g>

  <!-- Bird hint in negative space — small wren between W and F -->
  <!-- Eye dot where W and F intersect meaningfully -->
  <circle cx="74" cy="42" r="2.5" fill="#1B4BC8"/>
  <circle cx="75" cy="41" r="0.8" fill="white"/>

  <!-- Subtle beak extending from F -->
  <path d="M 106 28 L 112 24 L 106 32" fill="white" opacity="0.7"/>

  <!-- Forge spark at monogram intersection -->
  <circle cx="72" cy="28" r="2" fill="white" opacity="0.8"/>
  <circle cx="72" cy="28" r="5" fill="white" opacity="0.06"/>
</svg>
