<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg44" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C0A0A"/>
      <stop offset="100%" stop-color="#2D1515"/>
    </linearGradient>
    <radialGradient id="wax44" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>
    <radialGradient id="waxhi44" cx="0.3" cy="0.25" r="0.5">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg44)"/>

  <!-- Wax drips (irregular blob edges) -->
  <path d="M 60 10 C 70 10, 82 12, 90 18 C 98 24, 104 30, 108 38 C 112 46, 114 56, 112 64 C 110 72, 106 80, 100 86 C 108 84, 112 90, 108 96 C 104 100, 96 98, 92 92 C 86 100, 78 106, 70 108 C 62 110, 52 110, 44 106 C 36 102, 30 96, 26 88 C 18 90, 12 86, 14 80 C 16 74, 24 72, 30 76 C 22 68, 18 60, 18 50 C 18 40, 22 30, 28 22 C 36 14, 48 10, 60 10 Z"
