  <path d="M 60 10 C 70 10, 82 12, 90 18 C 98 24, 104 30, 108 38 C 112 46, 114 56, 112 64 C 110 72, 106 80, 100 86 C 108 84, 112 90, 108 96 C 104 100, 96 98, 92 92 C 86 100, 78 106, 70 108 C 62 110, 52 110, 44 106 C 36 102, 30 96, 26 88 C 18 90, 12 86, 14 80 C 16 74, 24 72, 30 76 C 22 68, 18 60, 18 50 C 18 40, 22 30, 28 22 C 36 14, 48 10, 60 10 Z"
        fill="url(#waxhi44)"/>

  <!-- Seal circle border (debossed line) -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="#7F1D1D" stroke-width="1.5" opacity="0.8"/>
  <circle cx="60" cy="60" r="36" fill="none" stroke="#991B1B" stroke-width="0.7" opacity="0.5"/>

  <!-- Wren impression (white/cream, slightly debossed feel) -->
  <g fill="#FEF2F2" opacity="0.9">
    <!-- Body -->
    <ellipse cx="58" cy="64" rx="12" ry="8" transform="rotate(-14, 58, 64)"/>
    <!-- Head -->
    <circle cx="72" cy="52" r="9"/>
    <!-- Neck -->
    <ellipse cx="66" cy="57" rx="7" ry="5.5" transform="rotate(-24, 66, 57)"/>
    <!-- Beak -->
    <path d="M 79 48 L 90 44 L 79 56 Z"/>
    <!-- Tail cocked up -->
    <path d="M 42 68 C 34 58, 24 44, 20 34 C 18 30, 20 27, 23 29 C 28 38, 38 54, 44 66 Z"/>
    <!-- Wing sweep -->
    <path d="M 52 62 C 44 52, 34 40, 28 32 C 26 30, 26 32, 28 34 C 34 42, 46 56, 52 64 Z" opacity="0.7"/>
  </g>
  <!-- Eye (deeper impression) -->
  <circle cx="74" cy="51" r="2.2" fill="#7F1D1D"/>
  <circle cx="74.5" cy="50.5" r="0.9" fill="#FEF2F2" opacity="0.5"/>

  <!-- "WF" text around seal edge -->
  <path id="sealarc44" d="M 60 24 A 36 36 0 0 1 96 60" fill="none"/>
  <text font-family="serif" font-size="7" fill="#FEF2F2" opacity="0.6" letter-spacing="2">
    <textPath href="#sealarc44">WRENFORGE</textPath>
  </text>
