<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ab" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="30%" stop-color="#EBF0FF"/>
      <stop offset="70%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#F4F7FF"/>
    </linearGradient>
    <radialGradient id="w1" cx="0.07" cy="0.07" r="0.5">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#DBEAFE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2" cx="0.93" cy="0.93" r="0.45">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#BFDBFE" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ad" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.55" fill="#94A3B8"/>
    </pattern>
    <!-- Wren outline for watermark -->
    <symbol id="aw" viewBox="0 0 54 42">
      <g fill="none" stroke="#94A3B8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 20 24 C 14 16, 6 8, 2 4" stroke-width="1.6"/>
        <path d="M 34 22 C 40 14, 48 8, 52 4" stroke-width="1.6"/>
        <path d="M 20 24 C 22 30, 28 32, 34 30 C 36 28, 36 24, 34 22" stroke-width="1.4"/>
        <circle cx="38" cy="18" r="4" stroke-width="1.2"/>
        <path d="M 41 16 L 50 13" stroke-width="1.2"/>
        <path d="M 18 22 C 14 18, 8 10, 6 6" stroke-width="1.3"/>
        <path d="M 16 24 C 12 22, 6 16, 4 12" stroke-width="1"/>
      </g>
    </symbol>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#ab)"/>
  <rect width="1920" height="1080" fill="url(#w1)"/>
  <rect width="1920" height="1080" fill="url(#w2)"/>

  <!-- Dot texture -->
  <g opacity="0.028">
    <rect width="1920" height="1080" fill="url(#ad)"/>
  </g>

  <!-- Wren watermarks at edges -->
  <g opacity="0.018">
    <use href="#aw" x="80" y="40" width="58" height="45" transform="rotate(-8, 109, 63)"/>
    <use href="#aw" x="1700" y="30" width="54" height="42" transform="rotate(10, 1727, 51)"/>
    <use href="#aw" x="40" y="880" width="52" height="40" transform="rotate(12, 66, 900)"/>
    <use href="#aw" x="1760" y="900" width="56" height="44" transform="rotate(-5, 1788, 922)"/>
    <use href="#aw" x="860" y="20" width="42" height="33" transform="rotate(4, 881, 37)"/>
    <use href="#aw" x="920" y="970" width="46" height="36" transform="rotate(-10, 943, 988)"/>
  </g>

  <!-- Corner ring accents -->
  <circle cx="100" cy="80" r="160" stroke="#CBD5E1" stroke-opacity="0.05" stroke-width="0.5" fill="none"/>
  <circle cx="1820" cy="1000" r="140" stroke="#CBD5E1" stroke-opacity="0.04" stroke-width="0.5" fill="none"/>
</svg>
