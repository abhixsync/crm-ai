<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft warm-neutral base -->
    <linearGradient id="abg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <!-- Very subtle blue wash top-left -->
    <radialGradient id="wash1" cx="0.1" cy="0.1" r="0.6">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0"/>
    </radialGradient>
    <!-- Very subtle green wash bottom-right -->
    <radialGradient id="wash2" cx="0.9" cy="0.9" r="0.5">
      <stop offset="0%" stop-color="#DCFCE7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#DCFCE7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#abg)"/>
  <rect width="1920" height="1080" fill="url(#wash1)"/>
  <rect width="1920" height="1080" fill="url(#wash2)"/>

  <!-- Faint dot pattern for texture -->
  <g opacity="0.035">
    <pattern id="adots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.8" fill="#94A3B8"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#adots)"/>
  </g>
</svg>
