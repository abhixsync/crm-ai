<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg41" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C1A2E"/>
      <stop offset="100%" stop-color="#0F2044"/>
    </linearGradient>
    <linearGradient id="bar41" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <!-- Clip to wren silhouette shape -->
    <clipPath id="wrenclip41">
      <!-- Wren body silhouette: head right, tail up-left, body center -->
      <path d="M 22 30 C 18 22, 20 14, 26 12 C 34 10, 42 18, 40 28
               C 48 24, 58 22, 68 26 C 78 30, 86 38, 86 48
               C 86 58, 78 66, 68 68 C 60 70, 52 68, 46 64
               C 42 70, 38 78, 38 86 C 38 92, 42 96, 40 98
               C 36 100, 30 96, 30 88 C 30 80, 34 72, 38 64
               C 30 60, 24 52, 22 44 C 20 38, 20 34, 22 30 Z"/>
    </clipPath>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg41)"/>

  <!-- Wren outline (faint guide) -->
  <path d="M 22 30 C 18 22, 20 14, 26 12 C 34 10, 42 18, 40 28
           C 48 24, 58 22, 68 26 C 78 30, 86 38, 86 48
           C 86 58, 78 66, 68 68 C 60 70, 52 68, 46 64
           C 42 70, 38 78, 38 86 C 38 92, 42 96, 40 98
           C 36 100, 30 96, 30 88 C 30 80, 34 72, 38 64
           C 30 60, 24 52, 22 44 C 20 38, 20 34, 22 30 Z"
        stroke="#2563EB" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Sound wave bars filling the wren silhouette -->
  <!-- Bars are horizontal, heights vary to mimic an audio waveform -->
  <!-- Clipped inside the wren shape -->
  <g clip-path="url(#wrenclip41)">
    <!-- Waveform bars — 20 vertical bars across, varying heights -->
    <rect x="8"  y="48" width="4" height="24" rx="2" fill="#3B82F6" opacity="0.7"/>
    <rect x="14" y="36" width="4" height="48" rx="2" fill="#60A5FA" opacity="0.85"/>
    <rect x="20" y="28" width="4" height="64" rx="2" fill="#93C5FD" opacity="0.9"/>
    <rect x="26" y="20" width="4" height="80" rx="2" fill="#60A5FA"/>
    <rect x="32" y="14" width="4" height="92" rx="2" fill="#3B82F6" opacity="0.95"/>
    <rect x="38" y="22" width="4" height="76" rx="2" fill="#93C5FD" opacity="0.85"/>
    <rect x="44" y="10" width="4" height="100" rx="2" fill="#BFDBFE"/>
    <rect x="50" y="18" width="4" height="84" rx="2" fill="#60A5FA" opacity="0.9"/>
    <rect x="56" y="30" width="4" height="60" rx="2" fill="#3B82F6" opacity="0.85"/>
    <rect x="62" y="12" width="4" height="96" rx="2" fill="#93C5FD"/>
    <rect x="68" y="26" width="4" height="68" rx="2" fill="#60A5FA" opacity="0.9"/>
    <rect x="74" y="16" width="4" height="88" rx="2" fill="#BFDBFE" opacity="0.85"/>
    <rect x="80" y="34" width="4" height="52" rx="2" fill="#3B82F6" opacity="0.8"/>
    <rect x="86" y="42" width="4" height="36" rx="2" fill="#60A5FA" opacity="0.7"/>
    <rect x="92" y="52" width="4" height="16" rx="2" fill="#3B82F6" opacity="0.6"/>
    <rect x="98" y="48" width="4" height="24" rx="2" fill="#2563EB" opacity="0.5"/>
    <rect x="104" y="54" width="4" height="12" rx="2" fill="#1D4ED8" opacity="0.4"/>
  </g>

  <!-- Wren beak (outside clip, hard-drawn) -->
  <path d="M 86 48 L 100 42 L 86 54 Z" fill="#60A5FA" opacity="0.9"/>
  <!-- Eye -->
  <circle cx="76" cy="36" r="3" fill="#0C1A2E" stroke="#60A5FA" stroke-width="1.5"/>
  <circle cx="76.5" cy="35.5" r="1.2" fill="white" opacity="0.8"/>
</svg>
