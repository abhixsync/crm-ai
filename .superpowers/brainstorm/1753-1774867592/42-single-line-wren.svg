<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg42" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F6F2"/>
      <stop offset="100%" stop-color="#EDE9E0"/>
    </linearGradient>
    <linearGradient id="line42" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg42)"/>

  <!-- Single continuous unbroken line drawing a wren -->
  <!-- Starts at tail tip, goes to beak, loops back through body -->
  <path d="
    M 18 18
    C 22 14, 28 12, 32 16
    C 36 20, 34 28, 30 32
    C 36 30, 44 28, 52 30
    C 60 32, 68 38, 72 46
    C 76 54, 74 64, 68 70
    C 62 76, 54 78, 46 76
    C 40 74, 36 70, 34 64
    C 30 70, 28 78, 30 86
    C 32 92, 36 96, 34 100
    C 32 104, 26 102, 26 96
    C 26 90, 30 82, 32 74
    C 26 68, 22 60, 22 50
    C 22 40, 26 32, 30 28
    C 26 24, 22 22, 18 18
    Z
  " stroke="url(#line42)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Beak (continuation of the single line) -->
  <path d="M 72 46 C 78 42, 86 38, 96 34" stroke="url(#line42)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Eye (only mark that isn't on the continuous line) -->
  <circle cx="62" cy="42" r="3.5" fill="#1E3A8A"/>
  <circle cx="63" cy="41" r="1.4" fill="white"/>

  <!-- Tiny "starting dot" at tail tip -->
  <circle cx="18" cy="18" r="2.5" fill="#2563EB" opacity="0.7"/>
</svg>
