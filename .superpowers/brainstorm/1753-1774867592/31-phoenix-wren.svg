<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg31" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="flame31a" x1="60" y1="110" x2="60" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="flame31b" x1="30" y1="100" x2="90" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg31)"/>

  <!-- Flame wings (rising upward) -->
  <!-- Left flame wing -->
  <path d="M 60 68 C 50 60, 36 50, 22 44 C 16 42, 14 46, 18 50 C 26 58, 38 66, 48 74 C 36 72, 24 70, 16 66 C 12 64, 12 68, 16 72 C 26 80, 42 82, 56 76 Z"
        fill="url(#flame31a)" opacity="0.9"/>
  <!-- Right flame wing -->
  <path d="M 60 68 C 70 60, 84 50, 98 44 C 104 42, 106 46, 102 50 C 94 58, 82 66, 72 74 C 84 72, 96 70, 104 66 C 108 64, 108 68, 104 72 C 94 80, 78 82, 64 76 Z"
        fill="url(#flame31a)" opacity="0.9"/>

  <!-- Flame tail (rising from below) -->
  <path d="M 60 80 C 54 74, 50 64, 52 56 C 54 48, 58 44, 56 38 C 60 44, 60 52, 64 48 C 62 40, 64 32, 68 28 C 66 36, 68 44, 72 40 C 70 32, 72 24, 78 20 C 74 30, 74 42, 70 50 C 74 60, 72 72, 66 80 Z"
        fill="url(#flame31b)" opacity="0.75"/>

  <!-- Wren body (ascending, small and agile) -->
  <g fill="white">
    <circle cx="60" cy="48" r="7.5"/>
    <ellipse cx="56" cy="54" rx="8" ry="5" transform="rotate(-10, 56, 54)"/>
    <!-- Beak -->
    <path d="M 65 44 L 75 40 L 65 52 Z"/>
    <!-- Upward tail becoming flame -->
    <path d="M 50 55 C 44 50, 40 42, 38 36 C 37 32, 39 30, 41 32 C 44 38, 48 48, 50 56 Z" opacity="0.8"/>
  </g>
  <!-- Eye -->
  <circle cx="62" cy="47" r="2" fill="#F59E0B"/>
  <circle cx="62.5" cy="46.5" r="0.8" fill="white"/>

  <!-- Rising ember sparks -->
  <g fill="#F59E0B" opacity="0.8">
    <circle cx="40" cy="32" r="1.5"/>
    <circle cx="80" cy="28" r="1.2"/>
    <circle cx="50" cy="20" r="1"/>
    <circle cx="70" cy="16" r="0.8"/>
    <circle cx="34" cy="24" r="0.9"/>
    <circle cx="88" cy="22" r="1"/>
  </g>
</svg>
