<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg37" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C1A2E"/>
      <stop offset="100%" stop-color="#1B3068"/>
    </linearGradient>
    <radialGradient id="iris37" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>
    <radialGradient id="glow37" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg37)"/>

  <!-- Outer glow -->
  <circle cx="60" cy="60" r="44" fill="url(#glow37)"/>

  <!-- Feather texture (subtle radiating lines) -->
  <g stroke="#1E3A8A" stroke-width="1" opacity="0.4">
    <path d="M 60 16 C 56 26, 52 36, 48 44"/>
    <path d="M 60 16 C 64 26, 68 36, 72 44"/>
    <path d="M 26 34 C 34 40, 42 46, 48 52"/>
    <path d="M 94 34 C 86 40, 78 46, 72 52"/>
  </g>

  <!-- Eyelid shape (almond/wren eye shape) -->
  <path d="M 14 60 C 24 44, 40 32, 60 30 C 80 32, 96 44, 106 60 C 96 76, 80 88, 60 90 C 40 88, 24 76, 14 60 Z"
        fill="#0C1A2E" stroke="#3B82F6" stroke-width="2"/>

  <!-- Iris -->
  <circle cx="60" cy="60" r="24" fill="url(#iris37)"/>

  <!-- Iris detail rings -->
  <circle cx="60" cy="60" r="20" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.5"/>
  <circle cx="60" cy="60" r="16" fill="none" stroke="#60A5FA" stroke-width="0.5" opacity="0.4"/>

  <!-- Pupil -->
  <circle cx="60" cy="60" r="10" fill="#050D1A"/>
  <circle cx="60" cy="60" r="8" fill="#030912"/>

  <!-- Catchlight (reflection highlight) -->
  <ellipse cx="55" cy="55" rx="5" ry="3.5" fill="white" opacity="0.7" transform="rotate(-20, 55, 55)"/>
  <circle cx="65" cy="63" r="2" fill="white" opacity="0.2"/>

  <!-- Small feather details at corners (wren-ness) -->
  <path d="M 14 60 C 12 54, 10 46, 14 38 C 16 34, 18 32, 16 36 C 14 42, 14 52, 16 60 Z"
        fill="#1E3A8A" opacity="0.6"/>
  <path d="M 106 60 C 108 54, 110 46, 106 38 C 104 34, 102 32, 104 36 C 106 42, 106 52, 104 60 Z"
        fill="#1E3A8A" opacity="0.6"/>

  <!-- Supercilium (eyebrow stripe — distinctive wren feature) -->
  <path d="M 20 46 C 32 40, 46 36, 60 35 C 74 36, 88 40, 100 46"
        stroke="#93C5FD" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
