<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg39" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#E8EEFB"/>
    </linearGradient>
    <linearGradient id="talon39" x1="40" y1="20" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg39)"/>

  <!-- Wren talon / footprint mark -->
  <!-- Three forward-facing toes + one rear toe (hallux) -->
  <!-- Wren has 3+1 toes arrangement -->

  <!-- Central pad / metatarsal area -->
  <ellipse cx="60" cy="72" rx="10" ry="7" fill="url(#talon39)" opacity="0.9"/>

  <!-- Toe 1 (middle, longest, forward) -->
  <path d="M 60 65 C 60 55, 58 44, 56 34 C 54 26, 50 20, 52 16 C 54 14, 58 18, 60 26 C 62 34, 62 44, 62 54 Z"
        fill="url(#talon39)"/>
  <!-- Claw 1 -->
  <path d="M 56 16 C 52 10, 50 6, 54 4 C 58 2, 62 8, 60 16 Z" fill="url(#talon39)"/>

  <!-- Toe 2 (left-forward) -->
  <path d="M 52 68 C 44 62, 36 54, 28 48 C 22 42, 16 40, 14 42 C 12 44, 16 50, 22 56 C 30 64, 42 70, 52 72 Z"
        fill="url(#talon39)"/>
  <!-- Claw 2 -->
  <path d="M 14 42 C 8 38, 4 36, 4 40 C 4 44, 10 46, 16 44 Z" fill="url(#talon39)"/>

  <!-- Toe 3 (right-forward) -->
  <path d="M 68 68 C 76 62, 84 54, 92 48 C 98 42, 104 40, 106 42 C 108 44, 104 50, 98 56 C 90 64, 78 70, 68 72 Z"
        fill="url(#talon39)"/>
  <!-- Claw 3 -->
  <path d="M 106 42 C 112 38, 116 36, 116 40 C 116 44, 110 46, 104 44 Z" fill="url(#talon39)"/>

  <!-- Hallux (rear toe, pointing backward) -->
  <path d="M 62 78 C 68 86, 72 96, 70 104 C 68 108, 64 108, 62 104 C 60 98, 60 88, 60 80 Z"
        fill="url(#talon39)"/>
  <!-- Hallux claw -->
  <path d="M 70 104 C 72 112, 70 116, 66 114 C 62 112, 62 106, 64 102 Z" fill="url(#talon39)"/>

  <!-- WF lettermark -->
  <text x="60" y="116" font-family="sans-serif" font-size="0" fill="#2563EB" text-anchor="middle"/>
</svg>
