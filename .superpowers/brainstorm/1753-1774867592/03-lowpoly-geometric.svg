<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <radialGradient id="hi3" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg3)"/>
  <rect width="120" height="120" rx="26" fill="url(#hi3)"/>

  <!-- Low-poly geometric wren — triangular facets -->
  <!-- Left wing facets -->
  <polygon points="48,52 30,34 18,24" fill="white" opacity="0.95"/>
  <polygon points="48,52 18,24 20,38" fill="white" opacity="0.75"/>
  <polygon points="48,52 20,38 36,54" fill="white" opacity="0.55"/>
  <polygon points="48,52 30,34 42,40" fill="white" opacity="0.85"/>

  <!-- Right wing facets -->
  <polygon points="70,48 88,32 102,22" fill="white" opacity="0.95"/>
  <polygon points="70,48 102,22 98,36" fill="white" opacity="0.75"/>
  <polygon points="70,48 98,36 82,50" fill="white" opacity="0.55"/>
  <polygon points="70,48 88,32 76,38" fill="white" opacity="0.85"/>

  <!-- Body facets -->
  <polygon points="48,52 60,44 70,48" fill="white" opacity="0.9"/>
  <polygon points="48,52 70,48 68,60" fill="white" opacity="0.7"/>
  <polygon points="48,52 68,60 54,64" fill="white" opacity="0.8"/>
  <polygon points="54,64 68,60 62,70" fill="white" opacity="0.65"/>

  <!-- Head facets -->
  <polygon points="70,48 60,44 68,36" fill="white" opacity="0.9"/>
  <polygon points="70,48 68,36 80,38" fill="white" opacity="0.85"/>
  <polygon points="68,36 80,38 76,32" fill="white" opacity="0.95"/>

  <!-- Beak -->
  <polygon points="80,38 76,32 92,34" fill="white" opacity="0.95"/>

  <!-- Tail facets — cocked up -->
  <polygon points="48,52 36,54 32,40" fill="white" opacity="0.8"/>
  <polygon points="36,54 32,40 24,32" fill="white" opacity="0.7"/>
  <polygon points="36,54 54,64 28,48" fill="white" opacity="0.6"/>
  <polygon points="28,48 54,64 42,60" fill="white" opacity="0.5"/>

  <!-- Eye -->
  <circle cx="76" cy="36" r="1.8" fill="#1B4BC8"/>

  <!-- Wireframe edges for faceted look -->
  <g stroke="#2563EB" stroke-width="0.4" opacity="0.3" fill="none">
    <polygon points="48,52 30,34 18,24"/>
    <polygon points="48,52 18,24 20,38"/>
    <polygon points="70,48 88,32 102,22"/>
    <polygon points="70,48 102,22 98,36"/>
    <polygon points="48,52 60,44 70,48"/>
    <polygon points="48,52 70,48 68,60"/>
    <polygon points="68,36 80,38 76,32"/>
    <line x1="48" y1="52" x2="36" y2="54"/>
    <line x1="36" y1="54" x2="32" y2="40"/>
    <line x1="32" y1="40" x2="24" y2="32"/>
  </g>
</svg>
