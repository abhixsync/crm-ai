<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg29" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg29)"/>

  <!-- Isometric anvil (3D perspective view) -->
  <!-- Top face (lighter) -->
  <path d="M 60 52 L 96 62 L 96 68 L 60 58 Z" fill="white" opacity="0.95"/>
  <path d="M 60 52 L 24 62 L 24 68 L 60 58 Z" fill="white" opacity="0.75"/>
  <!-- Anvil top surface (the flat working face) -->
  <path d="M 28 48 L 60 38 L 92 48 L 60 58 Z" fill="white" opacity="0.9"/>
  <!-- Left horn (isometric) -->
  <path d="M 28 48 L 14 44 C 10 43, 10 46, 14 47 L 28 54 Z" fill="white" opacity="0.8"/>
  <!-- Anvil body sides -->
  <path d="M 36 58 L 60 68 L 84 58 L 84 78 L 60 88 L 36 78 Z" fill="white" opacity="0.6"/>
  <!-- Anvil base bottom face -->
  <path d="M 32 78 L 60 88 L 88 78 L 88 86 L 60 96 L 32 86 Z" fill="white" opacity="0.45"/>

  <!-- Wren perched on top face of isometric anvil -->
  <g fill="white">
    <circle cx="72" cy="40" r="6"/>
    <ellipse cx="66" cy="44" rx="7" ry="4.5" transform="rotate(-14, 66, 44)"/>
    <path d="M 77 37 L 85 35 L 77 44 Z"/>
    <!-- Tail upward -->
    <path d="M 58 47 C 52 41, 44 31, 40 25 C 38 21, 40 19, 42 21 C 46 29, 54 41, 58 47 Z"/>
    <!-- Legs -->
    <line x1="64" y1="48" x2="63" y2="54" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="68" y1="47" x2="69" y2="53" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <circle cx="74" cy="39" r="1.6" fill="#1B4BC8"/>

  <!-- Forge glow lines on anvil top -->
  <path d="M 44 50 L 60 44 L 76 50" stroke="#F59E0B" stroke-width="1" opacity="0.4" fill="none"/>
</svg>
