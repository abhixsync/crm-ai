<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg12" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg12)"/>

  <!-- Shield -->
  <path d="M 60 12 L 100 27 L 100 60 C 100 82, 83 98, 60 108 C 37 98, 20 82, 20 60 L 20 27 Z"
        fill="white" opacity="0.10"/>
  <path d="M 60 12 L 100 27 L 100 60 C 100 82, 83 98, 60 108 C 37 98, 20 82, 20 60 L 20 27 Z"
        fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round" opacity="0.85"/>

  <!-- Small wren head crest on top of shield -->
  <g fill="white" opacity="0.95">
    <circle cx="60" cy="10" r="5.5"/>
    <path d="M 56 14 C 52 20, 52 24, 60 24 C 68 24, 68 20, 64 14 Z" opacity="0.6"/>
    <path d="M 64 8 L 70 5 L 64 11 Z"/>
  </g>

  <!-- Crossed forge hammers -->
  <g fill="white" opacity="0.92">
    <!-- Hammer 1 (top-left to bottom-right) -->
    <!-- Head -->
    <rect x="28" y="30" width="22" height="14" rx="3" transform="rotate(45, 39, 37)"/>
    <!-- Handle -->
    <rect x="50" y="48" width="5" height="32" rx="2.5" transform="rotate(45, 52, 64)"/>

    <!-- Hammer 2 (top-right to bottom-left) -->
    <!-- Head -->
    <rect x="70" y="30" width="22" height="14" rx="3" transform="rotate(-45, 81, 37)"/>
    <!-- Handle -->
    <rect x="65" y="48" width="5" height="32" rx="2.5" transform="rotate(-45, 68, 64)"/>
  </g>

  <!-- Center rivet/bolt where handles cross -->
  <circle cx="60" cy="67" r="5" fill="#1B4BC8" stroke="white" stroke-width="1.5"/>
  <circle cx="60" cy="67" r="2.5" fill="white" opacity="0.7"/>
</svg>
