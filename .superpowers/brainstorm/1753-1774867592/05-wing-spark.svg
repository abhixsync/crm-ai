<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <radialGradient id="hi5" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg5)"/>
  <rect width="120" height="120" rx="26" fill="url(#hi5)"/>

  <!-- Single sweeping wing — abstract, elegant -->
  <g fill="white">
    <!-- Primary wing sweep — large curved shape -->
    <path d="M 26 90 C 24 80, 22 60, 28 44 C 34 28, 48 18, 70 14 C 82 12, 94 16, 100 22
             C 94 24, 84 22, 74 24 C 58 28, 44 40, 38 56 C 32 72, 32 84, 34 90 Z"/>

    <!-- Secondary feather layer — overlapping for depth -->
    <path d="M 34 90 C 32 82, 34 66, 40 52 C 46 38, 58 28, 74 24
             C 66 30, 54 42, 48 56 C 42 70, 40 82, 42 90 Z" opacity="0.6"/>

    <!-- Third feather -->
    <path d="M 42 90 C 40 82, 44 66, 52 52 C 58 40, 68 32, 80 28
             C 72 34, 62 46, 56 58 C 50 72, 48 82, 50 90 Z" opacity="0.35"/>
  </g>

  <!-- Forge spark at wing tip -->
  <circle cx="98" cy="20" r="3" fill="white" opacity="0.9"/>
  <circle cx="98" cy="20" r="7" fill="white" opacity="0.08"/>
  <circle cx="98" cy="20" r="12" fill="white" opacity="0.04"/>

  <!-- Spark trail -->
  <circle cx="92" cy="14" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="86" cy="12" r="0.8" fill="white" opacity="0.35"/>
  <circle cx="104" cy="16" r="0.8" fill="white" opacity="0.35"/>

  <!-- Amber ember -->
  <circle cx="96" cy="16" r="1" fill="#F59E0B" opacity="0.5"/>
  <circle cx="102" cy="22" r="0.6" fill="#F59E0B" opacity="0.35"/>

  <!-- Feather accent lines -->
  <g stroke="white" stroke-width="0.5" opacity="0.15" stroke-linecap="round">
    <path d="M 30 84 C 32 64, 42 40, 68 22" fill="none"/>
    <path d="M 36 84 C 38 66, 48 44, 74 26" fill="none"/>
    <path d="M 42 84 C 44 68, 54 48, 80 30" fill="none"/>
  </g>
</svg>
