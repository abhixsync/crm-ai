<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg36" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0F1B3D"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg36)"/>

  <!-- Starfield background -->
  <g fill="white" opacity="0.2">
    <circle cx="16" cy="20" r="0.8"/>
    <circle cx="100" cy="14" r="0.6"/>
    <circle cx="108" cy="46" r="0.7"/>
    <circle cx="12" cy="80" r="0.5"/>
    <circle cx="104" cy="100" r="0.8"/>
    <circle cx="24" cy="108" r="0.6"/>
    <circle cx="92" cy="112" r="0.5"/>
    <circle cx="8" cy="54" r="0.6"/>
    <circle cx="116" cy="72" r="0.7"/>
    <circle cx="48" cy="110" r="0.5"/>
  </g>

  <!-- Constellation lines forming wren shape -->
  <!-- Define star positions that outline a wren -->
  <!-- Head: 76,32 -->
  <!-- Beak: 92,26, 104,20 -->
  <!-- Neck: 68,42 -->
  <!-- Body: 54,54, 46,62 -->
  <!-- Wing tip: 30,44, 16,36 -->
  <!-- Tail top: 38,46, 28,28, 18,16 -->
  <!-- Feet: 50,72, 58,74 -->

  <g stroke="#3B82F6" stroke-width="0.8" opacity="0.5">
    <!-- Head to beak -->
    <line x1="76" y1="32" x2="92" y2="26"/>
    <line x1="92" y1="26" x2="104" y2="20"/>
    <!-- Head to neck -->
    <line x1="76" y1="32" x2="68" y2="42"/>
    <!-- Neck to body -->
    <line x1="68" y1="42" x2="54" y2="54"/>
    <!-- Body to tail area -->
    <line x1="54" y1="54" x2="38" y2="46"/>
    <line x1="38" y1="46" x2="28" y2="28"/>
    <line x1="28" y1="28" x2="18" y2="16"/>
    <!-- Wing -->
    <line x1="54" y1="54" x2="30" y2="44"/>
    <line x1="30" y1="44" x2="16" y2="36"/>
    <!-- Body to lower -->
    <line x1="54" y1="54" x2="46" y2="62"/>
    <!-- Feet -->
    <line x1="46" y1="62" x2="50" y2="72"/>
    <line x1="46" y1="62" x2="58" y2="74"/>
  </g>

  <!-- Stars (constellation nodes) -->
  <g fill="#60A5FA">
    <circle cx="76" cy="32" r="3.5" opacity="1"/>   <!-- Head star (brightest) -->
    <circle cx="92" cy="26" r="2" opacity="0.9"/>   <!-- Beak 1 -->
    <circle cx="104" cy="20" r="1.5" opacity="0.7"/> <!-- Beak tip -->
    <circle cx="68" cy="42" r="2.5" opacity="0.9"/> <!-- Neck -->
    <circle cx="54" cy="54" r="3" opacity="0.95"/>  <!-- Body center -->
    <circle cx="38" cy="46" r="2" opacity="0.8"/>   <!-- Tail base -->
    <circle cx="28" cy="28" r="1.8" opacity="0.7"/> <!-- Tail mid -->
    <circle cx="18" cy="16" r="2.5" opacity="0.85"/><!-- Tail tip -->
    <circle cx="30" cy="44" r="1.8" opacity="0.75"/><!-- Wing mid -->
    <circle cx="16" cy="36" r="2" opacity="0.8"/>   <!-- Wing tip -->
    <circle cx="46" cy="62" r="2" opacity="0.85"/>  <!-- Lower body -->
    <circle cx="50" cy="72" r="1.5" opacity="0.6"/> <!-- Foot 1 -->
    <circle cx="58" cy="74" r="1.5" opacity="0.6"/> <!-- Foot 2 -->
  </g>

  <!-- Bright glow on head star -->
  <circle cx="76" cy="32" r="6" fill="#2563EB" opacity="0.2"/>
  <circle cx="76" cy="32" r="1.5" fill="white"/>

  <!-- "WRENFORGE" text faint -->
  <text x="60" y="100" font-family="sans-serif" font-size="8" fill="#3B82F6" opacity="0.6"
        text-anchor="middle" letter-spacing="3">WRENFORGE</text>
</svg>
