<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg50" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="metal50" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="30%" stop-color="#1F2937"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <mask id="platecutout50">
      <rect width="120" height="120" fill="white"/>
      <!-- Wren shape punched out of the plate -->
      <g fill="black">
        <ellipse cx="60" cy="63" rx="14" ry="9" transform="rotate(-14, 60, 63)"/>
        <circle cx="74" cy="50" r="11"/>
        <ellipse cx="68" cy="56" rx="9" ry="7" transform="rotate(-25, 68, 56)"/>
        <path d="M 82 46 L 98 40 L 82 58 Z"/>
        <path d="M 43 67 C 33 55, 22 40, 17 29 C 15 24, 17 21, 20 23 C 27 33, 38 50, 45 65 Z"/>
        <path d="M 53 65 C 44 53, 32 38, 25 28 C 23 25, 23 27, 25 30 C 33 42, 46 58, 55 66 Z" opacity="0.8"/>
      </g>
    </mask>
    <filter id="innerShadow50">
      <feFlood flood-color="rgba(0,0,0,0.6)"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg50)"/>

  <!-- Forge glow behind the cutout (warm amber/gold) -->
  <rect x="8" y="8" width="104" height="104" rx="18" fill="url(#bg50)"/>

  <!-- Metal plate with cutout -->
  <rect x="8" y="8" width="104" height="104" rx="18" fill="url(#metal50)" mask="url(#platecutout50)"/>

  <!-- Metal edge highlight (top-left bevel) -->
  <rect x="8" y="8" width="104" height="104" rx="18"
        fill="none" stroke="#4B5563" stroke-width="2" mask="url(#platecutout50)" opacity="0.6"/>

  <!-- Cutout edge glow (the forge light bleeding through) -->
  <ellipse cx="74" cy="50" r="13" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
  <path d="M 82 46 L 98 40 L 82 58 Z" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>

  <!-- Metal brushed texture lines -->
  <g stroke="#6B7280" stroke-width="0.5" opacity="0.2">
    <line x1="10" y1="20" x2="110" y2="20"/>
    <line x1="10" y1="28" x2="110" y2="28"/>
    <line x1="10" y1="36" x2="110" y2="36"/>
    <line x1="10" y1="44" x2="110" y2="44"/>
    <line x1="10" y1="52" x2="110" y2="52"/>
    <line x1="10" y1="60" x2="110" y2="60"/>
    <line x1="10" y1="68" x2="110" y2="68"/>
    <line x1="10" y1="76" x2="110" y2="76"/>
    <line x1="10" y1="84" x2="110" y2="84"/>
    <line x1="10" y1="92" x2="110" y2="92"/>
    <line x1="10" y1="100" x2="110" y2="100"/>
  </g>

  <!-- Rivet holes (industrial detail) -->
  <g fill="#1F2937" stroke="#4B5563" stroke-width="0.8" opacity="0.7">
    <circle cx="22" cy="22" r="3"/>
    <circle cx="98" cy="22" r="3"/>
    <circle cx="22" cy="98" r="3"/>
    <circle cx="98" cy="98" r="3"/>
  </g>
  <g fill="#374151" opacity="0.5">
    <circle cx="22" cy="22" r="1.5"/>
    <circle cx="98" cy="22" r="1.5"/>
    <circle cx="22" cy="98" r="1.5"/>
    <circle cx="98" cy="98" r="1.5"/>
  </g>

  <!-- Eye glow through cutout -->
  <circle cx="76" cy="49" r="3" fill="#F59E0B" opacity="0.7"/>
  <circle cx="76" cy="49" r="1.5" fill="#FCD34D"/>
</svg>
