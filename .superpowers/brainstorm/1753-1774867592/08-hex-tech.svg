<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg8" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <radialGradient id="hi8" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg8)"/>
  <rect width="120" height="120" rx="26" fill="url(#hi8)"/>

  <!-- Hexagon frame -->
  <polygon points="60,12 104,34 104,78 60,100 16,78 16,34"
           stroke="white" stroke-width="2" fill="none"/>
  <!-- Inner hex accent -->
  <polygon points="60,20 96,38 96,74 60,92 24,74 24,38"
           stroke="white" stroke-width="0.5" opacity="0.25" fill="none"/>

  <!-- Circuit nodes at hex vertices -->
  <g fill="white">
    <circle cx="60" cy="12" r="2.5"/>
    <circle cx="104" cy="34" r="2.5"/>
    <circle cx="104" cy="78" r="2.5"/>
    <circle cx="60" cy="100" r="2.5"/>
    <circle cx="16" cy="78" r="2.5"/>
    <circle cx="16" cy="34" r="2.5"/>
  </g>

  <!-- Circuit traces from nodes inward -->
  <g stroke="white" stroke-width="0.6" opacity="0.25" stroke-linecap="round">
    <line x1="60" y1="12" x2="60" y2="30"/>
    <line x1="104" y1="34" x2="86" y2="42"/>
    <line x1="16" y1="34" x2="34" y2="42"/>
    <line x1="104" y1="78" x2="86" y2="70"/>
    <line x1="16" y1="78" x2="34" y2="70"/>
    <line x1="60" y1="100" x2="60" y2="82"/>
  </g>

  <!-- Wren inside hexagon -->
  <g fill="white">
    <!-- Left wing -->
    <path d="M 48 52 C 42 44, 34 36, 28 32 C 26 32, 26 34, 28 36 C 34 44, 42 52, 46 56 Z"/>
    <!-- Right wing -->
    <path d="M 68 50 C 74 42, 82 34, 88 30 C 90 30, 90 32, 88 34 C 82 42, 74 50, 68 54 Z"/>
    <!-- Body -->
    <ellipse cx="58" cy="56" rx="11" ry="7" transform="rotate(-14, 58, 56)"/>
    <!-- Neck + Head -->
    <ellipse cx="66" cy="48" rx="6" ry="4.5" transform="rotate(-26, 66, 48)"/>
    <circle cx="74" cy="42" r="6.5"/>
    <!-- Beak -->
    <path d="M 79 39 L="88 36 L 79 43 Z"/>
    <!-- Tail cocked up -->
    <path d="M 44 58 C 38 52, 30 42, 28 36 C 26 32, 28 30, 30 32 C 34 40, 42 52, 46 56 Z"/>
    <path d="M 42 62 C 36 58, 28 48, 24 42 C 22 38, 24 36, 26 38 C 30 46, 38 56, 42 60 Z"/>
  </g>
  <circle cx="76" cy="41" r="1.4" fill="#1B4BC8"/>
  <circle cx="77" cy="40" r="0.5" fill="white"/>
</svg>
