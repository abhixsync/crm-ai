<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg48" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <linearGradient id="bird48" x1="10" y1="60" x2="110" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg48)"/>

  <!-- The wren's body NATURALLY forms a rightward arrow -->
  <!-- Tail = the arrow's left fletch, beak = arrowhead -->

  <!-- Arrow/bird combined shape -->
  <path d="
    M 14 44
    C 14 38, 18 32, 24 30
    C 30 28, 36 32, 40 38
    C 44 30, 50 22, 58 18
    C 66 14, 76 14, 82 18
    C 90 22, 96 30, 98 40
    C 104 36, 110 36, 112 42
    C 114 48, 110 54, 106 56
    C 110 60, 114 66, 112 72
    C 110 78, 104 78, 98 74
    C 96 84, 90 92, 82 96
    C 76 100, 66 100, 58 96
    C 50 92, 44 84, 40 76
    C 36 82, 30 86, 24 84
    C 18 82, 14 76, 14 70
    C 10 66, 8 62, 10 58
    C 12 54, 14 50, 14 44
    Z
  " fill="url(#bird48)" opacity="0.0"/>

  <!-- Actual wren-as-arrow design (cleaner, purpose-built) -->
  <!-- The tail feathers form the left "fletching" of an arrow -->
  <!-- The beak IS the arrowhead -->

  <g fill="white">
    <!-- Arrow body (wren torso) -->
    <ellipse cx="60" cy="60" rx="32" ry="14" fill="white" opacity="0.9"/>

    <!-- Tail / left fletch (V-shape pointing left = arrow nock) -->
    <path d="M 28 60 L 10 46 C 8 44, 8 48, 10 50 L 22 60 L 10 70 C 8 72, 8 76, 10 74 L 28 60 Z"/>

    <!-- Head -->
    <circle cx="76" cy="52" r="10"/>
    <!-- Neck -->
    <ellipse cx="70" cy="56" rx="8" ry="6" transform="rotate(-10, 70, 56)"/>

    <!-- Beak / arrowhead (classic arrow tip) -->
    <path d="M 84 52 L 106 60 L 84 68 L 88 62 L 80 62 L 80 58 L 88 58 Z"/>
  </g>

  <!-- Eye -->
  <circle cx="78" cy="50" r="2.5" fill="#1B4BC8"/>
  <circle cx="78.5" cy="49.5" r="1" fill="white"/>

  <!-- Wing detail lines -->
  <g stroke="#1B4BC8" stroke-width="1" fill="none" opacity="0.3">
    <path d="M 42 55 C 50 50, 60 48, 70 50"/>
    <path d="M 42 65 C 50 70, 60 72, 70 70"/>
  </g>

  <!-- Speed lines behind arrow -->
  <g stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.25">
    <line x1="6" y1="50" x2="18" y2="50"/>
    <line x1="4" y1="55" x2="16" y2="55"/>
    <line x1="6" y1="60" x2="18" y2="60"/>
    <line x1="4" y1="65" x2="16" y2="65"/>
    <line x1="6" y1="70" x2="18" y2="70"/>
  </g>
</svg>
