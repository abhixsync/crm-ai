<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg22" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg22)"/>

  <!-- Anvil (lower portion, bold) -->
  <g fill="white" opacity="0.85">
    <path d="M 22 86 L 98 86 L 104 80 L 16 80 Z"/>
    <path d="M 16 80 L 8 76 C 6 75, 6 77, 8 78 L 16 86 Z"/>
    <rect x="30" y="86" width="60" height="9" rx="1"/>
    <path d="M 26 95 L 94 95 L 90 104 L 30 104 Z"/>
    <rect x="24" y="104" width="72" height="5" rx="2.5"/>
  </g>

  <!-- Wren in flight above anvil -->
  <g fill="white">
    <!-- Left wing sweep -->
    <path d="M 56 46 C 48 36, 36 24, 22 18 C 20 17, 19 19, 21 21 C 32 30, 44 42, 54 52 Z"/>
    <!-- Right wing sweep -->
    <path d="M 64 46 C 72 36, 84 24, 98 18 C 100 17, 101 19, 99 21 C 88 30, 76 42, 66 52 Z"/>
    <!-- Body -->
    <ellipse cx="60" cy="54" rx="9" ry="5.5" transform="rotate(-3, 60, 54)"/>
    <!-- Head -->
    <circle cx="68" cy="46" r="7"/>
    <!-- Neck -->
    <ellipse cx="64" cy="50" rx="6" ry="4.5" transform="rotate(-15, 64, 50)"/>
    <!-- Beak -->
    <path d="M 73 43 L 82 40 L 73 50 Z"/>
    <!-- Tail -->
    <path d="M 52 57 C 46 53, 38 47, 34 43 C 32 41, 33 39, 35 40 C 40 44, 48 50, 52 55 Z"/>
  </g>
  <circle cx="70" cy="45" r="1.8" fill="#1B4BC8"/>

  <!-- Motion lines (speed streaks) -->
  <g stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="16" y1="50" x2="26" y2="50"/>
    <line x1="12" y1="55" x2="24" y2="55"/>
    <line x1="16" y1="60" x2="26" y2="60"/>
  </g>
</svg>
