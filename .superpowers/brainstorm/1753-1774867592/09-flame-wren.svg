<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg9" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <radialGradient id="hi9" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <!-- Warm flame gradient for flame tips -->
    <linearGradient id="flame" x1="40" y1="90" x2="40" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg9)"/>
  <rect width="120" height="120" rx="26" fill="url(#hi9)"/>

  <!-- Wren body — white solid -->
  <g fill="white">
    <!-- Body -->
    <ellipse cx="58" cy="58" rx="13" ry="9" transform="rotate(-18, 58, 58)"/>
    <!-- Neck -->
    <ellipse cx="67" cy="50" rx="8" ry="5.5" transform="rotate(-28, 67, 50)"/>
    <!-- Head -->
    <circle cx="76" cy="42" r="8"/>
    <!-- Beak -->
    <path d="M 83 39 L 94 35 L 83 44 Z"/>
    <!-- Core wing shapes (solid white base) -->
    <path d="M 50 52 C 44 44, 36 36, 30 32 C 28 32, 28 34, 30 36 C 36 44, 44 54, 48 58 Z"/>
    <path d="M 68 50 C 74 42, 82 34, 88 30 C 90 30, 90 32, 88 34 C 82 42, 74 50, 70 54 Z"/>
  </g>
  <circle cx="78" cy="41" r="1.6" fill="#1B4BC8"/>

  <!-- Flame extensions from wing tips — white to amber to red -->
  <!-- Left wing flames -->
  <path d="M 30 32 C 26 26, 20 18, 16 10 C 14 6, 18 8, 20 14 C 22 20, 26 28, 30 32"
        fill="url(#flame)" opacity="0.7"/>
  <path d="M 28 34 C 22 26, 14 18, 12 12 C 10 8, 14 10, 16 16 C 20 24, 24 30, 28 34"
        fill="url(#flame)" opacity="0.5"/>
  <path d="M 26 36 C 20 30, 14 22, 10 16 C 8 12, 12 14, 14 20 C 18 28, 22 32, 26 36"
        fill="url(#flame)" opacity="0.35"/>

  <!-- Right wing flames -->
  <path d="M 88 30 C 92 24, 98 16, 102 8 C 104 4, 100 6, 98 12 C 96 18, 92 26, 88 30"
        fill="url(#flame)" opacity="0.7"/>
  <path d="M 90 32 C 96 24, 102 16, 106 10 C 108 6, 104 8, 102 14 C 98 22, 94 28, 90 32"
        fill="url(#flame)" opacity="0.5"/>

  <!-- Tail flames — cocked up + dissolving into fire -->
  <path d="M 44 58 C 38 50, 28 36, 24 26 C 22 20, 20 14, 18 8 C 16 4, 20 8, 22 14 C 26 24, 34 42, 42 54"
        fill="url(#flame)" opacity="0.65"/>
  <path d="M 40 62 C 34 56, 24 42, 20 32 C 18 26, 16 20, 14 14 C 12 10, 16 14, 18 20 C 22 30, 32 48, 38 58"
        fill="url(#flame)" opacity="0.45"/>

  <!-- Spark embers floating off -->
  <circle cx="14" cy="6" r="1.5" fill="#FDE68A" opacity="0.6"/>
  <circle cx="106" cy="4" r="1.2" fill="#FDE68A" opacity="0.5"/>
  <circle cx="16" cy="12" r="0.8" fill="#F59E0B" opacity="0.4"/>
  <circle cx="20" cy="4" r="0.6" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="100" cy="8" r="0.7" fill="#F59E0B" opacity="0.4"/>
</svg>
