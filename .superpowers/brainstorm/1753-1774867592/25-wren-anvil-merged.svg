<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg25" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg25)"/>

  <!-- Abstract concept: the anvil body IS the bird body -->
  <!-- The anvil top surface flows into wren wings -->
  <!-- The anvil horn on left becomes the wren's head/beak -->

  <g fill="white" opacity="0.92">
    <!-- Anvil/wren hybrid body -->
    <!-- This is the anvil body which also reads as the bird's torso -->
    <path d="M 20 70 L 100 70 L 106 62 L 16 62 Z"/>

    <!-- Left anvil horn = wren's beak/head -->
    <path d="M 16 62 L 6 56 C 4 55, 4 58, 6 60 L 16 70 Z"/>
    <!-- The "beak tip" extension -->
    <path d="M 6 58 C 2 56, 0 58, 2 60 C 4 62, 8 60, 10 59 Z" opacity="0.7"/>

    <!-- Wren head (sits at left-center, the anvil horn area) -->
    <circle cx="22" cy="56" r="7"/>

    <!-- Wings sweeping up from anvil surface -->
    <!-- Left wing (from anvil top, sweeping up-left) -->
    <path d="M 36 62 C 32 52, 28 40, 24 30 C 22 26, 24 23, 26 25 C 30 34, 36 50, 38 62 Z"/>
    <!-- Right wing (from anvil top, sweeping up-right) -->
    <path d="M 72 62 C 78 50, 86 38, 96 28 C 98 25, 100 27, 98 30 C 90 42, 82 56, 76 64 Z"/>
    <!-- Right wing secondary feather -->
    <path d="M 84 48 C 90 40, 98 34, 104 28 C 106 26, 107 28, 106 30 C 100 36, 92 44, 86 52 Z" opacity="0.6"/>

    <!-- Tail cocked up (right side, like an anvil tail) -->
    <path d="M 98 62 C 104 54, 110 44, 112 38 C 114 34, 112 32, 110 34 C 106 42, 102 54, 98 64 Z"/>

    <!-- Anvil body/base (legs of bird) -->
    <path d="M 36 70 L 84 70 L 80 84 L 40 84 Z"/>
    <rect x="34" y="84" width="52" height="5" rx="2.5"/>
  </g>
  <!-- Wren eye -->
  <circle cx="24" cy="55" r="2" fill="#1B4BC8"/>
  <circle cx="24.5" cy="54.5" r="0.8" fill="white"/>
</svg>
