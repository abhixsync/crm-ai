<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg38" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <linearGradient id="flow38a" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="flow38b" x1="110" y1="10" x2="10" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg38)"/>

  <!-- Abstract fluid dynamics / data flow forming a wren shape -->
  <!-- Main body flow (broad sweeping curve) -->
  <path d="M 100 20 C 88 24, 76 32, 70 42 C 64 52, 64 62, 58 68 C 52 74, 44 76, 38 80 C 32 84, 28 90, 30 96"
        stroke="url(#flow38a)" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Wing flow (sweeps left) -->
  <path d="M 68 50 C 58 46, 46 40, 32 36 C 20 32, 12 34, 10 40"
        stroke="url(#flow38b)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Secondary wing flow -->
  <path d="M 66 58 C 54 54, 40 50, 24 48 C 14 46, 8 50, 10 56"
        stroke="url(#flow38b)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Head flow (tight curl) -->
  <path d="M 100 20 C 108 14, 112 8, 108 6 C 104 4, 98 8, 96 16 C 94 24, 98 32, 104 34 C 110 36, 114 32, 112 26"
        stroke="url(#flow38a)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Beak line -->
  <path d="M 108 6 L 116 2" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- Tail flow (cocked upward) -->
  <path d="M 58 68 C 50 62, 40 52, 34 40 C 28 28, 26 16, 30 10"
        stroke="url(#flow38b)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Particle dots (data nodes) -->
  <g fill="white" opacity="0.7">
    <circle cx="100" cy="20" r="3"/>
    <circle cx="70" cy="42" r="2.5"/>
    <circle cx="58" cy="68" r="2"/>
    <circle cx="32" cy="36" r="2"/>
    <circle cx="10" cy="40" r="1.5"/>
    <circle cx="30" cy="10" r="2"/>
    <circle cx="108" cy="6" r="2.5"/>
  </g>
</svg>
