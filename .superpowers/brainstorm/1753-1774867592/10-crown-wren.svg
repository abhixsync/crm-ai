<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg10" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
    <radialGradient id="hi10" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold gradient for crown -->
    <linearGradient id="gold" x1="60" y1="10" x2="60" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg10)"/>
  <rect width="120" height="120" rx="26" fill="url(#hi10)"/>

  <!-- Crown — floating above the bird -->
  <g>
    <!-- Crown base band -->
    <path d="M 44 36 L 76 36 L 78 32 L 42 32 Z" fill="url(#gold)"/>
    <!-- Crown points — 3 spikes -->
    <path d="M 46 32 L 50 18 L 54 28 L 60 14 L 66 28 L 70 18 L 74 32"
          fill="url(#gold)"/>
    <!-- Crown jewels -->
    <circle cx="50" cy="20" r="1.5" fill="white" opacity="0.8"/>
    <circle cx="60" cy="16" r="2" fill="white" opacity="0.9"/>
    <circle cx="70" cy="20" r="1.5" fill="white" opacity="0.8"/>
    <!-- Crown inner line -->
    <line x1="46" y1="30" x2="74" y2="30" stroke="white" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Wren bird beneath crown -->
  <g fill="white">
    <!-- Left wing -->
    <path d="M 46 60 C 38 50, 28 40, 22 36 C 20 36, 20 38, 22 40 C 28 48, 38 58, 44 64 Z"/>
    <!-- Right wing -->
    <path d="M 68 56 C 74 48, 84 38, 90 34 C 92 34, 92 36, 90 38 C 84 46, 74 56, 68 62 Z"/>
    <!-- Body -->
    <ellipse cx="56" cy="64" rx="13" ry="9" transform="rotate(-16, 56, 64)"/>
    <!-- Neck -->
    <ellipse cx="65" cy="56" rx="8" ry="5.5" transform="rotate(-26, 65, 56)"/>
    <!-- Head — positioned right under crown -->
    <circle cx="74" cy="48" r="8"/>
    <!-- Beak -->
    <path d="M 81 45 L="92 41 L 81 50 Z"/>
    <!-- Tail cocked up -->
    <path d="M 40 66 C 34 60, 26 48, 24 42 C 22 38, 24 36, 26 38 C 30 46, 38 58, 42 64 Z"/>
    <path d="M 38 70 C 32 66, 22 54, 18 48 C 16 44, 18 42, 20 44 C 26 52, 34 64, 38 68 Z"/>
  </g>
  <circle cx="76" cy="47" r="1.6" fill="#1B4BC8"/>
  <circle cx="77" cy="46" r="0.6" fill="white"/>

  <!-- Subtle golden glow around crown -->
  <ellipse cx="60" cy="24" rx="24" ry="14" fill="#F59E0B" opacity="0.04"/>
</svg>
