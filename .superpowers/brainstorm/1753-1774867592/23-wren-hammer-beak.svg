<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg23" x1="12" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1B4BC8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg23)"/>

  <!-- Anvil -->
  <g fill="white" opacity="0.88">
    <path d="M 24 78 L 96 78 L 102 72 L 18 72 Z"/>
    <path d="M 18 72 L 10 68 C 8 67, 8 70, 10 71 L 18 78 Z"/>
    <rect x="32" y="78" width="56" height="9" rx="1"/>
    <path d="M 28 87 L 92 87 L 88 97 L 32 97 Z"/>
    <rect x="26" y="97" width="68" height="5" rx="2.5"/>
  </g>

  <!-- Wren on anvil, holding hammer in beak -->
  <g fill="white">
    <!-- Body -->
    <ellipse cx="60" cy="56" rx="11" ry="7" transform="rotate(-10, 60, 56)"/>
    <!-- Head -->
    <circle cx="74" cy="44" r="8"/>
    <!-- Neck -->
    <ellipse cx="68" cy="49" rx="6.5" ry="5" transform="rotate(-22, 68, 49)"/>
    <!-- Tail -->
    <path d="M 46 60 C 38 52, 28 38, 24 30 C 22 26, 24 23, 26 25 C 32 34, 42 50, 48 58 Z"/>
    <!-- Wing fold -->
    <path d="M 54 55 C 46 47, 36 37, 30 30 C 28 28, 29 26, 31 28 C 37 36, 48 48, 54 56 Z" opacity="0.6"/>
    <!-- Legs -->
    <line x1="58" y1="62" x2="56" y2="72" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="64" y1="62" x2="66" y2="72" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <circle cx="76" cy="43" r="1.8" fill="#1B4BC8"/>

  <!-- Small hammer held in beak -->
  <g fill="#F59E0B">
    <!-- Hammer handle (diagonal, from beak) -->
    <rect x="80" y="36" width="3.5" height="20" rx="1.5" transform="rotate(30, 81, 46)"/>
    <!-- Hammer head -->
    <rect x="89" y="28" width="14" height="9" rx="2" transform="rotate(30, 96, 32)"/>
  </g>

  <!-- Sparks from hammer contact -->
  <g fill="#F59E0B" opacity="0.8">
    <circle cx="96" cy="32" r="1.5"/>
    <circle cx="100" cy="26" r="1"/>
    <circle cx="104" cy="30" r="0.8"/>
    <circle cx="102" cy="38" r="1.2"/>
  </g>
</svg>
